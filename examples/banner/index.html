<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exchange Rates — WordPress banner</title>
	<link rel="icon" href="../../plugin/trunk/assets/img/bank.svg" type="image/svg+xml">
	<link rel="stylesheet" href="banner.css">
</head>
<body>
	<main class="banner-frame">
		<article class="banner" aria-label="Exchange Rates plugin banner with abstract currency tools">
			<header class="brand">
				<img class="brand__logo" src="../../plugin/trunk/assets/img/bank.svg" width="512" height="433" alt="">
				<h1>Exchange<br>Rates</h1>
				<p class="brand__benefit"><span class="key-icon" aria-hidden="true"></span>No API key required</p>
			</header>

			<div class="showcase">
				<section class="panel converter" aria-labelledby="converter-title">
					<h2 id="converter-title">Currency Converter</h2>
					<div class="product-illustration converter__illustration" role="img" aria-label="Currency converter illustration with circular flags, abstract amount and selector labels, swap arrows and a result. No currency names or values are shown.">
						<div class="converter__fields" aria-hidden="true">
							<div class="amount-row">
								<div class="field amount"><span class="illustration-line amount-line"></span></div>
								<div class="field swap"><img src="assets/swap.svg" width="24" height="24" alt=""></div>
							</div>
							<div class="field currency-field">
								<img class="flag" src="../../plugin/trunk/assets/flags/circular/us.svg" width="512" height="512" alt="">
								<span class="illustration-line selector-line"></span>
								<img class="chevron" src="assets/chevron-down.svg" width="16" height="16" alt="">
							</div>
							<div class="field currency-field">
								<img class="flag" src="../../plugin/trunk/assets/flags/circular/eu.svg" width="512" height="512" alt="">
								<span class="illustration-line selector-line selector-line--short"></span>
								<img class="chevron" src="assets/chevron-down.svg" width="16" height="16" alt="">
							</div>
						</div>
						<div class="converter__result" aria-hidden="true"><span class="illustration-line result-line"></span></div>
					</div>
				</section>

				<section class="panel rates" aria-labelledby="rates-title">
					<h2 id="rates-title">Exchange Rates</h2>
					<div class="product-illustration rates__illustration" role="img" aria-label="Exchange-rate table illustration with circular flags, five abstract rows and upward and downward trend arrows. No currency names, rates or percentages are shown.">
						<div class="rates__header" aria-hidden="true">
							<span class="illustration-line"></span><span class="illustration-line"></span><span class="illustration-line"></span>
						</div>
						<div class="rates__rows" aria-hidden="true">
							<div class="rates-row">
								<span class="currency-label"><img class="flag" src="../../plugin/trunk/assets/flags/circular/eu.svg" width="512" height="512" alt=""><span class="illustration-line name-line"></span></span>
								<span class="rate-value"><span class="illustration-line rate-line"></span></span>
								<span class="change change--up"><img class="trend" src="assets/up.svg" width="24" height="24" alt=""><span class="illustration-line change-line"></span></span>
							</div>
							<div class="rates-row">
								<span class="currency-label"><img class="flag" src="../../plugin/trunk/assets/flags/circular/gb.svg" width="512" height="512" alt=""><span class="illustration-line name-line name-line--short"></span></span>
								<span class="rate-value"><span class="illustration-line rate-line rate-line--short"></span></span>
								<span class="change change--down"><img class="trend" src="assets/down.svg" width="24" height="24" alt=""><span class="illustration-line change-line"></span></span>
							</div>
							<div class="rates-row">
								<span class="currency-label"><img class="flag" src="../../plugin/trunk/assets/flags/circular/jp.svg" width="512" height="512" alt=""><span class="illustration-line name-line"></span></span>
								<span class="rate-value"><span class="illustration-line rate-line"></span></span>
								<span class="change change--up"><img class="trend" src="assets/up.svg" width="24" height="24" alt=""><span class="illustration-line change-line"></span></span>
							</div>
							<div class="rates-row">
								<span class="currency-label"><img class="flag" src="../../plugin/trunk/assets/flags/circular/ca.svg" width="512" height="512" alt=""><span class="illustration-line name-line name-line--short"></span></span>
								<span class="rate-value"><span class="illustration-line rate-line rate-line--short"></span></span>
								<span class="change change--down"><img class="trend" src="assets/down.svg" width="24" height="24" alt=""><span class="illustration-line change-line"></span></span>
							</div>
							<div class="rates-row">
								<span class="currency-label"><img class="flag" src="../../plugin/trunk/assets/flags/circular/ch.svg" width="512" height="512" alt=""><span class="illustration-line name-line"></span></span>
								<span class="rate-value"><span class="illustration-line rate-line"></span></span>
								<span class="change change--up"><img class="trend" src="assets/up.svg" width="24" height="24" alt=""><span class="illustration-line change-line"></span></span>
							</div>
						</div>
					</div>
				</section>
			</div>
		</article>
	</main>
</body>
</html>
