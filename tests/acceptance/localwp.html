<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalWP upgrade acceptance</title>
<style>body{margin:24px;font:14px/1.5 system-ui;color:#26313b}button,select{font:inherit;padding:8px;margin:4px}iframe{display:block;border:1px solid #ddd;height:780px;width:390px}pre{white-space:pre-wrap}#progress{font-weight:600}</style>
<h1>LocalWP — saved configuration acceptance</h1><p>Actual installed ZIP, persisted options and widget instances. Synthetic rates. No publication.</p>
<p id="agent"></p><button id="run">Run checks</button><label>Preview <select id="surface"><option>table</option><option>converter</option><option>badge</option><option>native-table</option><option>native-converter</option><option>sidebar</option></select></label><label>Width <select id="width"><option>390</option><option>1280</option></select></label><button id="preview">Show saved widget</button><button id="modal">Open details</button>
<p id="progress">Ready</p><pre id="summary"></pre><iframe id="subject" title="Saved LocalWP configuration"></iframe><details><summary>Evidence</summary><pre id="results"></pre></details>
<script>
'use strict';
const stage=new URLSearchParams(location.search).get('stage')||'candidate';
const candidate=['candidate','restored'].includes(stage),version=candidate?'1.5.0':'1.4.2';
const browser=navigator.userAgent.includes('Firefox/')?'firefox':navigator.userAgent.includes('Chrome/')?'chromium':'safari';
document.getElementById('agent').textContent=navigator.userAgent;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));let frame=document.getElementById('subject');
async function load(c){frame.style.width=c.width+'px';await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Load timeout')),20000);frame.onload=()=>{clearTimeout(timer);resolve()};frame.src='/?er_localwp=view&surface='+c.surface+'&failure='+(c.failure||'');});await frame.contentDocument.fonts.ready;await pause(150);return frame.contentWindow;}
function visibleText(el){const clone=el.cloneNode(true);clone.querySelectorAll('.er-a11y-sr-only,img').forEach(e=>e.remove());return clone.textContent.trim();}
async function runCase(c){const errors=[];let assertions=0;const check=(ok,name)=>{assertions++;if(!ok)errors.push(name)};const w=await load(c),d=w.document,root=d.querySelector('#localwp-fixture');
check(!!root,'fixture rendered');if(!root)return {...c,assertions,errors,pass:false};
const widgets=[...root.querySelectorAll('[data-exchange-rates-version]')];check(widgets.length===(c.surface==='sidebar'?2:1),'saved widgets rendered');check(widgets.every(e=>e.dataset.exchangeRatesVersion===version),'installed runtime version');
const values=()=>[...root.querySelectorAll('td[data-rate],.result,.badge-leaders')].map(visibleText);
const initial=values();check(initial.length>0&&initial.every(Boolean),'nonempty numeric values');
check(root.scrollWidth<=root.clientWidth+1,'no horizontal overflow');
const modal=d.querySelector('#exchange-rates-information');
if(candidate){check(!!modal&&w.getComputedStyle(modal).display==='none'&&modal.getBoundingClientRect().height===0,'closed modal absent from layout');const buttons=[...root.querySelectorAll('[data-er-info]')];check(buttons.length===widgets.length,'details control per instance');
for(const button of buttons){button.focus();button.click();await pause(30);if(c.failure){check(!modal.open&&w.getComputedStyle(modal).display==='none','failed modal stays hidden');continue;}
check(modal.matches(':modal'),'modal in top layer');check([...modal.querySelectorAll('dt')].slice(1).map(e=>e.textContent.trim()).join('|')==='Check:|Latest change:','published date labels and order');check(modal.querySelector('[data-er-modal-recorded]').dateTime===new Date(button.dataset.recordedAt).toISOString(),'Check saved-entry timestamp');check(d.activeElement===modal.querySelector('h2'),'heading receives focus');check(modal.querySelector('[data-er-modal-source-name]').textContent===button.dataset.sourceName,'saved source matches');check(modal.querySelector('[data-er-modal-date]').dateTime===new Date(button.dataset.updatedAt||button.querySelector('time').dateTime).toISOString(),'saved timestamp matches');check(modal.textContent.includes('[ExchangeRatesWP]'),'disclaimer marker');check(modal.textContent.includes('1.5.0'),'plugin version');check([...modal.querySelectorAll('a')].every(e=>e.rel.includes('nofollow')),'modal links nofollow');const b=modal.getBoundingClientRect();check(b.left>=0&&b.top>=0&&b.right<=w.innerWidth+1&&b.bottom<=w.innerHeight+1,'modal fits viewport');modal.querySelector('.er-dialog-close').click();check(d.activeElement===button,'focus restored');}
}
if(!c.failure){for(const widget of widgets){const input=widget.querySelector('input');if(input){const before=values();input.value='2';input.dispatchEvent(new w.Event('input',{bubbles:true}));await pause(300);check(JSON.stringify(values())!==JSON.stringify(before),'editable amount changes values');if(candidate){input.value='0';input.dispatchEvent(new w.Event('input',{bubbles:true}));await pause(300);const local=[...widget.querySelectorAll('td[data-rate],.result')].map(visibleText);check(local.length>0&&local.every(v=>/0/.test(v)&&!/[1-9]/.test(v)),'zero stays zero');input.value='abc';input.dispatchEvent(new w.Event('input',{bubbles:true}));await pause(300);check(input.getAttribute('aria-invalid')==='true','invalid amount identified');input.value='2';input.dispatchEvent(new w.Event('input',{bubbles:true}));await pause(300);check(!input.hasAttribute('aria-invalid'),'valid amount recovers');}
}const selects=widget.querySelectorAll('select');if(selects.length===2){const before=visibleText(widget.querySelector('.result'));selects[1].value='GBP';selects[1].dispatchEvent(new w.Event('change',{bubbles:true}));await pause(300);check(visibleText(widget.querySelector('.result'))!==before,'currency selection changes conversion');}}}
check(!(w.erLocalErrors||[]).length,'no uncaught errors');return {...c,version,initial,assertions,errors,pass:!errors.length};}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;const report={stage,browser,version,userAgent:navigator.userAgent,started:new Date().toISOString(),cases:[]};const configs=[];for(const width of [1280,390])for(const surface of ['table','converter','badge','native-table','native-converter','sidebar'])configs.push({width,surface});if(candidate)for(const failure of ['missing','throws','nonmodal'])for(const surface of ['table','converter','badge','native-table','native-converter'])configs.push({width:390,surface,failure});
const start=performance.now();for(const c of configs){try{report.cases.push(await runCase(c))}catch(e){report.cases.push({...c,pass:false,errors:[e.message],assertions:0})}document.getElementById('progress').textContent=report.cases.length+'/'+configs.length+' · '+Math.round(100*report.cases.length/configs.length)+'% · '+Math.round((performance.now()-start)/1000)+' s';}
report.finished=new Date().toISOString();document.getElementById('results').textContent=JSON.stringify(report,null,2);document.getElementById('summary').textContent=JSON.stringify({cases:report.cases.length,assertions:report.cases.reduce((n,c)=>n+c.assertions,0),passed:report.cases.filter(c=>c.pass).length,failures:report.cases.filter(c=>!c.pass)},null,2);
const response=await fetch('/?er_localwp=runner',{method:'POST',headers:{'Content-Type':'application/json','X-Acceptance-Nonce':'__NONCE__'},body:JSON.stringify(report)});if(!response.ok||!(await response.json()).success)throw Error('Evidence save failed');document.getElementById('progress').textContent='Completed and saved · '+stage+' · '+browser;document.getElementById('run').disabled=false;};
document.getElementById('preview').onclick=()=>load({surface:document.getElementById('surface').value,width:Number(document.getElementById('width').value)});
document.getElementById('modal').onclick=()=>frame.contentDocument.querySelector('[data-er-info]')?.click();
</script></html>
