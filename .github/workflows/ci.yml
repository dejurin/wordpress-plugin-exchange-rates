name: CI

on:
  push:
    branches: [main, dev, 'chore/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '8.3', '8.4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: python3 scripts/plugin.py lint
      - run: php tests/formatting.php
      - run: php -l tests/formatting-wordpress.php
      - run: php -l tests/http-fixture.php && php -l tests/table-isolation-wordpress.php
      - run: php -l tests/browser-admin.php

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 scripts/plugin.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exchange-rates-plugin
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  wordpress:
    name: WordPress 7.1.3 / PHP 8.3 smoke and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: exchange-rates-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: wordpress/compose.yaml:wordpress/compose.test.yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: python3 scripts/dev-env.py
      - run: docker compose --env-file wordpress/.env config --quiet
      - run: docker compose --env-file wordpress/.env up -d --wait --wait-timeout 180
      - run: docker compose --env-file wordpress/.env run --rm --entrypoint sh cli /opt/dev/init.sh
      - run: docker compose --env-file wordpress/.env run --rm cli eval-file /opt/tests/smoke.php
      - run: docker compose --env-file wordpress/.env run --rm cli eval-file /opt/tests/formatting-wordpress.php seed
      - run: docker compose --env-file wordpress/.env run --rm cli eval-file /opt/tests/formatting-wordpress.php verify
      - run: docker compose --env-file wordpress/.env run --rm cli eval-file /opt/tests/table-isolation-wordpress.php seed
      - run: npm test
        working-directory: tests/browser
        env:
          WP_TEST_URL: http://127.0.0.1:18972
      - run: docker compose --env-file wordpress/.env run --rm cli eval-file /opt/tests/table-isolation-wordpress.php verify
      - name: Check HTTP and plugin assets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'http://127.0.0.1:18972/?pagename=exchange-rates-smoke' --output /tmp/exchange-rates-smoke.html
          grep -Fq 'Local test fixture.' /tmp/exchange-rates-smoke.html
          grep -Fq 'cr-exchange-rates' /tmp/exchange-rates-smoke.html
          curl --fail --silent --show-error http://127.0.0.1:18972/wp-content/plugins/exchange-rates/assets/css/public/style.css > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18972/wp-content/plugins/exchange-rates/assets/js/public/common.js > /dev/null
      - name: Diagnostics on failure
        if: failure()
        run: docker compose --env-file wordpress/.env logs --tail=100 wordpress
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-regression-failures
          path: tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this disposable CI environment
        if: always()
        run: docker compose --env-file wordpress/.env down --volumes
